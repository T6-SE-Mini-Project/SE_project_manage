
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Online Book Store</title>
</head>
<body>
    <h1>Customer Login</h1>
    <p>Log in to your Online Book Store account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</body>
</html>
