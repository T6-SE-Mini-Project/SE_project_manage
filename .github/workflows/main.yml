
name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: online_book_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        env:
          DB_NAME: online_book_store
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "true"
        run: python manage.py check

      - name: Check for missing migrations
        env:
          DB_NAME: online_book_store
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        env:
          DB_NAME: online_book_store
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "true"
          # The whole suite runs in one process from one address, so a
          # shared rate-limit counter or response cache would make one
          # test's requests change the next one's answer. Both features
          # are tested by turning them on explicitly, in
          # config/tests_throttle.py and config/tests_cache.py.
          THROTTLE_ENABLED: "false"
          CACHE_ENABLED: "false"
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check the frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
