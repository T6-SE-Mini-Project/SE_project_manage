
name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: online_book_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        env:
          DB_NAME: online_book_store
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DJANGO_SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
        run: python manage.py check

      - name: Run registration and login tests
        env:
          DB_NAME: online_book_store
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DJANGO_SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
        run: python manage.py test accounts
